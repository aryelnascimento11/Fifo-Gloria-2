<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fifo Gloria</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="shortcut icon" href="img/logo fifo.png" type="image/x-icon">
</head>

<body>

    <header class="header">
        <h1 class="logo">FIFO <span>GLORIA</span></h1>

        <nav>
            <ul class="menu">
                <li><a href="#">Início</a></li>
                <li><a href="./sobre.html">Sobre</a></li>
            </ul>
        </nav>

        <button class="lang-btn">PT / EN</button>
    </header>

    <section class="hero">
        <img src="./img/banner bonito.png" alt="Banner do mercado">
        <div class="hero-text">
            <h2>Fifo Gloria</h2>
            <p>Preço justo, qualidade garantida</p>
        </div>
    </section>

    <section class="offers">
        <h2>Ofertas Relâmpago</h2>
        <!-- O container fica vazio para receber exclusivamente os dados cadastrados via Painel -->
        <div id="offers-grid" class="offers-grid"></div>
        <a href="fifoVirtual.html" class="btn-more">Ver nossa loja</a>
    </section>

    <section class="feedback-section">
        <div class="titulo-feedback">
            <h2>
                DÊ SEU <span>FEEDBACK</span>
            </h2>

            <div class="linha"></div>

            <p>
                Conte sua experiência com a FIFO
            </p>
        </div>

        <div class="feedback-card">
            <span class="avaliacao-texto">
                SUA AVALIAÇÃO
            </span>

            <div id="estrelas" class="estrelas">
                <input type="radio" id="star5" name="result" value="5">
                <label for="star5">★</label>

                <input type="radio" id="star4" name="result" value="4">
                <label for="star4">★</label>

                <input type="radio" id="star3" name="result" value="3">
                <label for="star3">★</label>

                <input type="radio" id="star2" name="result" value="2">
                <label for="star2">★</label>

                <input type="radio" id="star1" name="result" value="1">
                <label for="star1">★</label>
            </div>

            <div class="campo">
                <input id="nomes" type="text" placeholder="SEU NOME" maxlength="50" required>
            </div>

            <div class="campo">
                <textarea id="textos" placeholder="SEU FEEDBACK (MÁX. 100 CARACTERES)" maxlength="100" required></textarea>
            </div>

            <button id="btn-feedback" class="btn-feedback">
                ENVIAR COMENTÁRIO
            </button>
        </div>
    </section>

    <div>
        <ul class="listasTX" id="listasTX"></ul>
    </div>

    <footer class="footer">
        <div class="footer-icons">
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-facebook"></i></a>
            <a href="#"><i class="fa-solid fa-location-dot"></i></a>
        </div>
        <p>© 2026 Fifo Gloria — Todos os direitos reservados</p>
    </footer>

    <!-- SCRIPTS CARREGADOS NO FINAL DO BODY -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>
    <script src="feedback.js"></script>

</body>

</html>
