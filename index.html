<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fifo Gloria</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<header class="header">
    <h1 class="logo">FIFO <span>GLORIA</span></h1>

    <nav>
        <ul class="menu">
            <li><a href="#">Início</a></li>
            <li><a href="#">Sobre</a></li>
        </ul>
    </nav>

    <button class="lang-btn">PT / EN</button>
</header>

<section class="hero">
    <img src="./img/banner bonito.png" alt="Banner do mercado">
    <div class="hero-text">
        <h2>Fifo Gloria</h2>
        <p>Preço justo, qualidade garantida</p>
    </div>
</section>

<section class="offers">
    <h2>Ofertas da Semana</h2>
    <div class="offers-grid">
        <div class="offer-card">
            <img src="./img/produto 1.png" alt="">
            <h3>Produto 1</h3>
            <div class="prices">
                <span class="old-price">R$ 20,00</span>
                <span class="new-price">R$ 10,00</span>
            </div>
        </div>
        <div class="offer-card">
            <img src="./img/produto 2.png" alt="">
            <h3>Produto 2</h3>
            <div class="prices">
                <span class="old-price">R$ 15,00</span>
                <span class="new-price">R$ 9,99</span>
            </div>
        </div>
        <div class="offer-card">
            <img src="./img/produto 3.png" alt="">
            <h3>Produto 3</h3>
            <div class="prices">
                <span class="old-price">R$ 30,00</span>
                <span class="new-price">R$ 19,90</span>
            </div>
        </div>
    </div>
    <a href="ofertas.html" class="btn-more">Ver mais ofertas</a>
</section>

<footer class="footer">
    <div class="footer-icons">
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
        <a href="#"><i class="fa-brands fa-facebook"></i></a>
        <a href="#"><i class="fa-solid fa-location-dot"></i></a>
    </div>
    <p>© 2026 Fifo Gloria — Todos os direitos reservados</p>
</footer>

</body>
</html>
